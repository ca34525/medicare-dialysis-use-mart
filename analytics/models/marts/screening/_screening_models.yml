          - {county_fips: '01003', svi_vintage: 2022, acs_period_start: 2018, acs_period_end: 2022, rpl_themes: 0.5, rpl_themes_status: reported, source_manifest_run_id: svi-fixture, source_snapshot_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc, source_retrieved_at_utc: '2026-08-14T19:46:25Z', source_modified_at: '2024-12-18T21:12:51Z'}
          - {county_fips: '02013', svi_vintage: 2022, acs_period_start: 2018, acs_period_end: 2022, rpl_themes: 0.8, rpl_themes_status: reported, source_manifest_run_id: svi-fixture, source_snapshot_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc, source_retrieved_at_utc: '2026-08-14T19:46:25Z', source_modified_at: '2024-12-18T21:12:51Z'}
