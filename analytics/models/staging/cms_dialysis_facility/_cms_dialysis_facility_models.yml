version: 2

models:
  - name: stg_cms_dialysis_facility
    description: >-
      One typed row per textual CCN in one verified current facility snapshot.
      Raw measure tokens remain beside typed values, and CMS availability codes
      govern whether a rating or outcome is exposed as reported. Facility
      location is public business-location context, not patient residence.
    config:
      contract:
        enforced: true
    columns:
      - {name: ccn, data_type: varchar, description: "Textual CMS Certification Number; leading zeros are material.", data_tests: [not_null, unique]}
      - {name: facility_name, data_type: varchar, description: "Source facility name.", data_tests: [not_null]}
      - {name: address_line_1, data_type: varchar, description: "Public business address line one."}
      - {name: address_line_2, data_type: varchar, description: "Public business address line two."}
      - {name: city, data_type: varchar, description: "Source public business city."}
      - {name: state, data_type: varchar, description: "Source public business state postal code."}
      - {name: zip_code, data_type: varchar, description: "Source ZIP text; never a county key."}
      - {name: source_county, data_type: varchar, description: "Unmapped source county/parish label."}
      - {name: telephone, data_type: varchar, description: "Public business telephone string."}
      - {name: ownership_status, data_type: varchar, description: "Source profit or non-profit category."}
      - {name: chain_owned_raw, data_type: varchar, description: "Raw chain-owned token."}
      - {name: chain_owned, data_type: boolean, description: "Typed chain-owned flag."}
      - {name: chain_organization, data_type: varchar, description: "Source chain organization label."}
      - {name: dialysis_stations_raw, data_type: varchar, description: "Raw dialysis-station count token."}
      - {name: dialysis_stations, data_type: integer, description: "Nonnegative dialysis-station count; zero remains zero."}
      - {name: in_center_hemodialysis_raw, data_type: varchar, description: "Raw in-center hemodialysis token."}
      - {name: in_center_hemodialysis, data_type: boolean, description: "Typed in-center hemodialysis offering flag."}
      - {name: peritoneal_dialysis_raw, data_type: varchar, description: "Raw peritoneal dialysis token."}
      - {name: peritoneal_dialysis, data_type: boolean, description: "Typed peritoneal dialysis offering flag."}
      - {name: home_hemodialysis_training_raw, data_type: varchar, description: "Raw home hemodialysis training token."}
      - {name: home_hemodialysis_training, data_type: boolean, description: "Typed home hemodialysis training flag."}
      - {name: certification_date_raw, data_type: varchar, description: "Raw certification-date token."}
      - {name: certification_date, data_type: date, description: "Typed facility certification date."}
      - {name: five_star_period_raw, data_type: varchar, description: "Raw quality-star measurement period."}
      - {name: five_star_period_start, data_type: date, description: "Quality-star period start."}
      - {name: five_star_period_end, data_type: date, description: "Quality-star period end."}
      - {name: five_star_rating_raw, data_type: varchar, description: "Raw star-rating token retained even when unavailable."}
      - {name: five_star_rating, data_type: integer, description: "Reported integer star rating from 1 through 5."}
      - {name: five_star_availability_code, data_type: varchar, description: "Raw CMS star-rating availability code.", data_tests: [not_null]}
      - {name: five_star_availability_status, data_type: varchar, description: "Available, not_available, or invalid.", data_tests: [not_null]}
      - {name: five_star_unavailability_reason, data_type: varchar, description: "Stable label for the source-defined unavailability reason."}
      - {name: survival_period_raw, data_type: varchar, description: "Raw survival measurement period."}
      - {name: survival_period_start, data_type: date, description: "Survival period start."}
      - {name: survival_period_end, data_type: date, description: "Survival period end."}
      - {name: survival_availability_code, data_type: varchar, description: "Raw CMS survival availability code.", data_tests: [not_null]}
      - {name: survival_availability_status, data_type: varchar, description: "Interpreted survival availability status.", data_tests: [not_null]}
      - {name: survival_unavailability_reason, data_type: varchar, description: "Source-defined survival unavailability reason."}
      - {name: survival_category_raw, data_type: varchar, description: "Raw source survival category."}
      - {name: survival_category, data_type: varchar, description: "Normalized reported survival category."}
      - {name: survival_denominator_raw, data_type: varchar, description: "Raw number of patients in the survival summary."}
      - {name: survival_denominator, data_type: bigint, description: "Reported survival-summary patient denominator."}
      - {name: survival_estimate_raw, data_type: varchar, description: "Raw mortality-rate token."}
      - {name: survival_estimate, data_type: "decimal(18,10)", description: "Reported mortality rate per 100 patient-years."}
      - {name: survival_lower_confidence_limit_raw, data_type: varchar, description: "Raw survival lower confidence limit."}
      - {name: survival_lower_confidence_limit, data_type: "decimal(18,10)", description: "Reported survival lower confidence limit."}
      - {name: survival_upper_confidence_limit_raw, data_type: varchar, description: "Raw survival upper confidence limit."}
      - {name: survival_upper_confidence_limit, data_type: "decimal(18,10)", description: "Reported survival upper confidence limit."}
      - {name: hospitalization_period_raw, data_type: varchar, description: "Raw hospitalization measurement period."}
      - {name: hospitalization_period_start, data_type: date, description: "Hospitalization period start."}
      - {name: hospitalization_period_end, data_type: date, description: "Hospitalization period end."}
      - {name: hospitalization_availability_code, data_type: varchar, description: "Raw CMS hospitalization availability code.", data_tests: [not_null]}
      - {name: hospitalization_availability_status, data_type: varchar, description: "Interpreted hospitalization availability status.", data_tests: [not_null]}
      - {name: hospitalization_unavailability_reason, data_type: varchar, description: "Source-defined hospitalization unavailability reason."}
      - {name: hospitalization_category_raw, data_type: varchar, description: "Raw source hospitalization category."}
      - {name: hospitalization_category, data_type: varchar, description: "Normalized reported hospitalization category."}
      - {name: hospitalization_denominator_raw, data_type: varchar, description: "Raw hospitalization patient denominator."}
      - {name: hospitalization_denominator, data_type: bigint, description: "Reported hospitalization-summary patient denominator."}
      - {name: hospitalization_estimate_raw, data_type: varchar, description: "Raw hospitalization-rate token."}
      - {name: hospitalization_estimate, data_type: "decimal(18,10)", description: "Reported hospitalization rate per 100 patient-years."}
      - {name: hospitalization_lower_confidence_limit_raw, data_type: varchar, description: "Raw hospitalization lower confidence limit."}
      - {name: hospitalization_lower_confidence_limit, data_type: "decimal(18,10)", description: "Reported hospitalization lower confidence limit."}
      - {name: hospitalization_upper_confidence_limit_raw, data_type: varchar, description: "Raw hospitalization upper confidence limit."}
      - {name: hospitalization_upper_confidence_limit, data_type: "decimal(18,10)", description: "Reported hospitalization upper confidence limit."}
      - {name: readmission_period_raw, data_type: varchar, description: "Raw readmission measurement period."}
      - {name: readmission_period_start, data_type: date, description: "Readmission period start."}
      - {name: readmission_period_end, data_type: date, description: "Readmission period end."}
      - {name: readmission_availability_code, data_type: varchar, description: "Raw CMS readmission availability code.", data_tests: [not_null]}
      - {name: readmission_availability_status, data_type: varchar, description: "Interpreted readmission availability status.", data_tests: [not_null]}
      - {name: readmission_unavailability_reason, data_type: varchar, description: "Source-defined readmission unavailability reason."}
      - {name: readmission_category_raw, data_type: varchar, description: "Raw source readmission category."}
      - {name: readmission_category, data_type: varchar, description: "Normalized reported readmission category."}
      - {name: readmission_denominator_raw, data_type: varchar, description: "Raw readmission hospitalization denominator."}
      - {name: readmission_denominator, data_type: bigint, description: "Reported readmission-summary index-discharge denominator."}
      - {name: readmission_estimate_raw, data_type: varchar, description: "Raw readmission-rate token."}
      - {name: readmission_estimate, data_type: "decimal(18,10)", description: "Reported readmission percentage of hospital discharges."}
      - {name: readmission_lower_confidence_limit_raw, data_type: varchar, description: "Raw readmission lower confidence limit."}
      - {name: readmission_lower_confidence_limit, data_type: "decimal(18,10)", description: "Reported readmission lower confidence limit."}
      - {name: readmission_upper_confidence_limit_raw, data_type: varchar, description: "Raw readmission upper confidence limit."}
      - {name: readmission_upper_confidence_limit, data_type: "decimal(18,10)", description: "Reported readmission upper confidence limit."}
      - {name: source_id, data_type: varchar, description: "Logical source ID from the verified manifest.", data_tests: [not_null]}
      - {name: source_manifest_run_id, data_type: varchar, description: "Facility manifest run ID.", data_tests: [not_null]}
      - {name: source_snapshot_sha256, data_type: varchar, description: "SHA-256 identity of the complete CSV snapshot.", data_tests: [not_null]}
      - {name: source_retrieved_at_utc, data_type: varchar, description: "UTC retrieval timestamp.", data_tests: [not_null]}
      - {name: source_release, data_type: varchar, description: "Quarterly source release."}
      - {name: source_modified_at, data_type: varchar, description: "Upstream source modified date."}
