[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-care-analytics-mart"
version = "0.1.0"
description = "A reproducible county screening mart for kidney-care market research."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.11.13",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
    "setuptools==84.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--basetemp=data/.pytest-tmp",
    "-ra",
]
cache_dir = "data/.pytest-cache"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
