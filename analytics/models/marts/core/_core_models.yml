version: 2

models:
  - name: dim_county
    description: >-
      One governed county identity per five-character FIPS: the complete SVI
      2022 current U.S. county surface plus 11 reviewed CMS-only historical
      identities. Historical rows remain inactive and explicitly
      discontinuous; no successor allocation or trend bridge is supplied.
    config:
      contract:
        enforced: true
    columns:
      - name: county_fips
        data_type: varchar
        description: Canonical five-character county FIPS.
        data_tests: [not_null, unique]
      - name: state_fips
        data_type: varchar
        description: Two-character state FIPS.
        data_tests: [not_null]
      - name: state_name
        data_type: varchar
        description: Source state label.
        data_tests: [not_null]
      - name: state_abbreviation
        data_type: varchar
        description: Source state abbreviation.
        data_tests: [not_null]
      - name: county_name
        data_type: varchar
        description: Current SVI or exact historical CMS county label.
        data_tests: [not_null]
      - name: geography_status
        data_type: varchar
        description: current_in_scope or historical_source_only.
        data_tests: [not_null]
      - name: is_current_county
        data_type: boolean
        description: True only for the current SVI 2022 identity surface.
        data_tests: [not_null]
      - name: svi_geography_vintage
        data_type: integer
        description: SVI county release year; null for historical-only rows.
      - name: observed_cms_start_year
        data_type: integer
        description: First CMS year observed for this exact FIPS identity.
      - name: observed_cms_end_year
        data_type: integer
        description: Last CMS year observed for this exact FIPS identity.
      - name: boundary_discontinuity_warning
        data_type: varchar
        description: Required warning for historical-only identities.
      - name: geography_source_id
        data_type: varchar
        description: Logical source providing the county identity row.
        data_tests: [not_null]
      - name: geography_source_version
        data_type: varchar
        description: SVI raw contract or reviewed seed version.
        data_tests: [not_null]
      - name: geography_source_manifest_run_id
        data_type: varchar
        description: Verified SVI run or version-controlled seed marker.
        data_tests: [not_null]
      - name: geography_source_snapshot_sha256
        data_type: varchar
        description: SVI page-set identity; null for version-controlled seed rows.

  - name: fct_svi_county
    description: >-
      One row per county FIPS and SVI vintage. The five U.S.-based county ranks
      and six selected source percentages retain explicit availability status,
      ACS period, exact source-defined units and denominators, and manifest
      lineage. This contextual fact does not classify screening quadrants.
    config:
      contract:
        enforced: true
    columns:
      - name: county_fips
        data_type: varchar
        description: Five-character county FIPS foreign key to dim_county.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_fips
      - name: svi_vintage
        data_type: integer
        description: Static SVI release year, 2022.
        data_tests: [not_null]
      - name: acs_period_start
        data_type: integer
        description: First year of the ACS period, 2018.
        data_tests: [not_null]
      - name: acs_period_end
        data_type: integer
        description: Last year of the ACS period, 2022.
        data_tests: [not_null]
      - name: rpl_themes
        data_type: decimal(18, 10)
        description: Overall U.S. county percentile rank, 0 to 1.
      - name: rpl_themes_status
        data_type: varchar
        description: Availability/typing status for the overall rank.
        data_tests: [not_null]
      - name: rpl_theme1
        data_type: decimal(18, 10)
        description: Socioeconomic Status U.S. county rank, 0 to 1.
      - name: rpl_theme1_status
        data_type: varchar
        description: Availability/typing status for theme 1.
        data_tests: [not_null]
      - name: rpl_theme2
        data_type: decimal(18, 10)
        description: Household Characteristics U.S. county rank, 0 to 1.
      - name: rpl_theme2_status
        data_type: varchar
        description: Availability/typing status for theme 2.
        data_tests: [not_null]
      - name: rpl_theme3
        data_type: decimal(18, 10)
        description: Minority Status U.S. county rank, 0 to 1.
      - name: rpl_theme3_status
        data_type: varchar
        description: Availability/typing status for theme 3.
        data_tests: [not_null]
      - name: rpl_theme4
        data_type: decimal(18, 10)
        description: Housing/Transportation U.S. county rank, 0 to 1.
      - name: rpl_theme4_status
        data_type: varchar
        description: Availability/typing status for theme 4.
        data_tests: [not_null]
      - name: ep_pov150
        data_type: decimal(18, 10)
        description: >-
          Persons below 150% poverty, 0 to 100; denominator S1701_C01_001E.
      - name: ep_pov150_status
        data_type: varchar
        description: Availability/typing status for EP_POV150.
        data_tests: [not_null]
      - name: ep_uninsur
        data_type: decimal(18, 10)
        description: >-
          Uninsured share, 0 to 100; denominator is the civilian
          noninstitutionalized population in S2701_C05_001E.
      - name: ep_uninsur_status
        data_type: varchar
        description: Availability/typing status for EP_UNINSUR.
        data_tests: [not_null]
      - name: ep_age65
        data_type: decimal(18, 10)
        description: >-
          Age 65+ share, 0 to 100; denominator is total population represented
          by S0101_C02_030E.
      - name: ep_age65_status
        data_type: varchar
        description: Availability/typing status for EP_AGE65.
        data_tests: [not_null]
      - name: ep_disabl
        data_type: decimal(18, 10)
        description: >-
          Disability share, 0 to 100; denominator is the civilian
          noninstitutionalized population represented by DP02_0072PE.
      - name: ep_disabl_status
        data_type: varchar
        description: Availability/typing status for EP_DISABL.
        data_tests: [not_null]
      - name: ep_limeng
        data_type: decimal(18, 10)
        description: >-
          Speaks English less than well, 0 to 100; denominator is persons age
          5+ represented by B16005_001E.
      - name: ep_limeng_status
        data_type: varchar
        description: Availability/typing status for EP_LIMENG.
        data_tests: [not_null]
      - name: ep_noveh
        data_type: decimal(18, 10)
        description: >-
          No-vehicle household share, 0 to 100; denominator is households
          represented by DP04_0058PE.
      - name: ep_noveh_status
        data_type: varchar
        description: Availability/typing status for EP_NOVEH.
        data_tests: [not_null]
      - name: source_id
        data_type: varchar
        description: Logical source ID from the verified manifest.
        data_tests: [not_null]
      - name: source_manifest_run_id
        data_type: varchar
        description: Pipeline run ID from the verified manifest.
        data_tests: [not_null]
      - name: source_snapshot_sha256
        data_type: varchar
        description: SHA-256 identity of the ordered exact-page set.
        data_tests: [not_null]
      - name: source_retrieved_at_utc
        data_type: varchar
        description: UTC retrieval timestamp from the verified manifest.
        data_tests: [not_null]
      - name: source_modified_at
        data_type: varchar
        description: ArcGIS layer edit timestamp from the manifest.

unit_tests:
  - name: county_dimension_retains_text_identity_and_provenance
    description: Leading-zero FIPS and DC remain exact with source provenance.
    model: dim_county
    given:
      - input: ref('stg_cdc_svi_county_2022')
        rows:
          - {county_fips: '01001', state_fips: '01', state_name: Synthetic Alabama, state_abbreviation: AL, county_name: Synthetic County A, svi_vintage: 2022, source_id: cdc_svi_county_2022, source_manifest_run_id: fixture, source_snapshot_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
          - {county_fips: '11001', state_fips: '11', state_name: District of Columbia, state_abbreviation: DC, county_name: Synthetic District of Columbia, svi_vintage: 2022, source_id: cdc_svi_county_2022, source_manifest_run_id: fixture, source_snapshot_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      - input: ref('stg_cms_om_gv_county_year')
        rows:
          - {county_fips: '01001', year: 2024}
          - {county_fips: '11001', year: 2024}
          - {county_fips: '09001', year: 2021}
      - input: ref('historical_county_identities')
        rows:
          - {county_fips: '09001', state_fips: '09', state_name: Connecticut, state_abbreviation: CT, county_name: Fairfield, observed_cms_start_year: 2014, observed_cms_end_year: 2021, geography_status: historical_source_only, is_current_county: false, boundary_discontinuity_warning: No successor allocation, seed_version: plan006.1}
    expect:
      rows:
        - {county_fips: '01001', state_fips: '01', geography_status: current_in_scope, is_current_county: true, svi_geography_vintage: 2022, observed_cms_start_year: 2024, observed_cms_end_year: 2024, geography_source_id: cdc_svi_county_2022}
        - {county_fips: '11001', state_fips: '11', geography_status: current_in_scope, is_current_county: true, svi_geography_vintage: 2022, observed_cms_start_year: 2024, observed_cms_end_year: 2024, geography_source_id: cdc_svi_county_2022}
        - {county_fips: '09001', state_fips: '09', geography_status: historical_source_only, is_current_county: false, svi_geography_vintage: null, observed_cms_start_year: 2014, observed_cms_end_year: 2021, geography_source_id: cms_om_gv_historical_identity_seed}
